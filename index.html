<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Chocolate Day ❤️</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #2b0a0a, #4b1c1c);
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      text-align: center;
    }
    .card {
      background: rgba(0,0,0,0.4);
      padding: 30px;
      border-radius: 20px;
      max-width: 400px;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 22px;
      line-height: 1.4;
    }
    .heart {
      font-size: 40px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="heart">🍫❤️</div>
    <h1>
      I don’t need chocolate to crave sweetness.<br><br>
      I crave <b>you</b> — your touch, your love, your presence.<br><br>
      Happy Chocolate Day, baby 🤎
    </h1>
  </div>
</body>
</html>
